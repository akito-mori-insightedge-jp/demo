<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>勤怠アプリ</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
  </head>
  <body>
    <section class="section">
      <div class="container">
        <h1 class="title">勤怠アプリ</h1>
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="notification is-{{ 'danger' if category == 'error' else category }}">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="{{ url_for('clock_in') }}" method="post" class="mb-4">
          <div class="field has-addons">
            <div class="control is-expanded">
              <input class="input" type="text" name="employee_name" placeholder="社員名" required>
            </div>
            <div class="control">
              <button class="button is-primary" type="submit">出勤</button>
            </div>
          </div>
        </form>

        <form action="{{ url_for('clock_out') }}" method="post" class="mb-5">
          <div class="field has-addons">
            <div class="control is-expanded">
              <input class="input" type="text" name="employee_name" placeholder="社員名" required>
            </div>
            <div class="control">
              <button class="button is-link" type="submit">退勤</button>
            </div>
          </div>
        </form>

        <a class="button" href="{{ url_for('records') }}">記録一覧を見る</a>
      </div>
    </section>
  </body>
  </html>
